<body><div id="bg"></div><div id="stage"><div id="app"></div></div>
<script>
/* ============ 1. CARD LIBRARY ============ */
const SUITS=['♠','♥','♣','♦'];           // 0 = Spade (always trump in Call Break)
const RANKS={11:'J',12:'Q',13:'K',14:'A'};
const rankName=r=>RANKS[r]||r;
function rand(n){const b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]%n}
function newDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({s,r});return d}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortHand(h){return h.slice().sort((a,b)=>a.s-b.s||b.r-a.r)}

/* ============ 2. GAME: CALL BREAK ============
   Naya game add karna ho to isi tarah ek object banao aur Registry me daal do.
   Interface: id, name, createInitialState, getValidMoves, applyMove, isGameOver, getScores */
function trickWinner(trick){
  const ls=trick[0].c.s;let best=trick[0];
  for(const t of trick.slice(1)){
    const a=t.c,b=best.c;
    if(a.s===b.s?a.r>b.r:(a.s===0&&b.s!==0))best=t;
  }
  return best.p;
}
function validCards(hand,trick){
  if(!trick.length)return hand;
  const ls=trick[0].c.s,wp=trickWinner(trick),wc=trick.find(t=>t.p===wp).c;
  const same=hand.filter(c=>c.s===ls);
  if(same.length){
    if(wc.s===ls){const hi=same.filter(c=>c.r>wc.r);return hi.length?hi:same}
    return same;
  }
  const sp=hand.filter(c=>c.s===0);
  if(sp.length){
    if(wc.s===0){const hi=sp.filter(c=>c.r>wc.r);return hi.length?hi:hand}   // EASY niyam: bada hukum na ho to koi bhi patta chal sakta hai
    return sp;
  }
  return hand;
}
const CallBreak={
  id:'callbreak',name:'Call Break',minPlayers:4,maxPlayers:6,supportsTeams:false,ROUNDS:5,
  createInitialState(o={}){const n=o.players||4,t=o.target||0;return this.deal({n,hpp:n===4?13:n===5?10:8,round:0,rounds:t?0:(o.rounds||5),target:t,dealer:0,totals:Array(n).fill(0),history:[],seed:o.seed})},
  deal(st){
    const n=st.n,hpp=st.hpp;let h,k=0;do{let d=st.seed!=null?sshuffle(newDeck(),st.seed*31+st.round*7+(k++)):shuffle(newDeck());
      d=d.filter(c=>!(c.r===2&&(n===6||(n===5&&(c.s===2||c.s===3)))));   // 5 khiladi: 2♣,2♦ hate; 6 khiladi: chaaron 2
      h=Array.from({length:n},(_,i)=>sortHand(d.slice(i*hpp,i*hpp+hpp)))}
    while(h.some(x=>!x.some(c=>c.s===0)));          // kisi ke paas spade na ho to auto redeal
    return {...st,hands:h,bids:Array(n).fill(null),won:Array(n).fill(0),trick:[],played:[],turn:(st.dealer+1)%n,phase:'bid',lastTrick:null,roundScore:null};
  },
  getValidMoves(st,p){
    if(st.phase==='bid')return Array.from({length:st.hpp},(_,i)=>({t:'bid',n:i+1}));
    if(st.phase==='play')return validCards(st.hands[p],st.trick).map(c=>({t:'play',c}));
    return [];
  },
  applyMove(st,p,m){
    const s=structuredClone(st);
    if(m.t==='bid'){
      s.bids[p]=m.n;s.turn=(p+1)%s.n;
      if(s.bids.every(b=>b!==null)){s.phase='play';s.turn=(s.dealer+1)%s.n}
      return s;
    }
    s.hands[p]=s.hands[p].filter(c=>!(c.s===m.c.s&&c.r===m.c.r));
    s.trick.push({p,c:m.c});s.played.push(m.c);s.turn=(p+1)%s.n;
    if(s.trick.length===s.n){
      const w=trickWinner(s.trick);s.won[w]++;s.lastTrick={cards:s.trick,w};s.trick=[];s.turn=w;
      if(s.hands.every(h=>!h.length)){
        const mul=1;   // 5 ya 6 khiladi me bhi ank wahi: jitni bid boli utne hi
        s.roundScore=s.bids.map((b,i)=>Math.round((s.won[i]>=b?b+(s.won[i]-b)*.1:-b)*mul*10)/10);
        s.totals=s.totals.map((t,i)=>Math.round((t+s.roundScore[i])*10)/10);
        s.history.push({bids:s.bids,won:s.won,score:s.roundScore});
        const fin=s.target?(Math.max(...s.totals)>=s.target||s.round+1>=15):(s.round+1>=s.rounds);   // target mode: sabse pehle 11/21 par pahunchne wala
        s.phase=fin?'over':'roundEnd';
      }
    }
    return s;
  },
  nextRound(st){return this.deal({...st,round:st.round+1,dealer:(st.dealer+1)%st.n})},
  isGameOver:st=>st.phase==='over',
  getScores:st=>st.totals
};
/* ============ KOT PIECE (Court Piece) engine ============
   4 khilari, team = p%2 (saamne wala partner). Rang (trump) 5 patte dekhkar bola jata hai.
   Sar jama hoti rehti hai (pile). Jab ek hi khilari lagatar 2 sar jeete, wo poori pile uthata hai. */
function kotWinner(trick,tr){
  let best=trick[0];
  for(const t of trick.slice(1)){const a=t.c,b=best.c;
    if(a.s===b.s?a.r>b.r:(a.s===tr&&b.s!==tr))best=t}
  return best.p;
}
function kotFin(s,st,wt,kot,early){   // round khatam: ank, itihas, agla baantne wala
  const pts=kot?2:1,dt=st.dealer%2;
  s.score[wt]+=pts;
  s.roundInfo={wt,kot,pts,early:!!early,chBy:s.by};
  s.history.push({won:s.won.slice(),wt,kot,early:!!early});
  s.phase=s.score[wt]>=s.target?'over':'roundEnd';
  let nd=st.dealer;
  if(wt===dt)nd=(st.dealer+1)%4;          // jeetne wali team nahi baantegi
  else if(kot)nd=(st.dealer+2)%4;         // baantne wali team par kot: uska partner baantega
  s.nextDealer=nd;return s;
}
function kotValid(hand,trick){
  if(!trick.length)return hand;
  const same=hand.filter(c=>c.s===trick[0].c.s);
  return same.length?same:hand;            // rang ho to wahi, warna koi bhi patta
}
/* Rang Bid ka niyam (sab khiladi par: insaan, bot, online): 1) chale hue rang ka patta ho to wahi chalo, aur jeet sakte ho to BADA patta chalna zaroori
   2) us rang ka patta na ho to kat (trump) chalna zaroori (kat pehle chal chuka ho to usse bada kat; bada kat na ho to koi bhi patta)  3) kat bhi na ho to apni marzi ka patta */
function rangValid(hand,trick,tr){
  if(!trick.length)return hand;
  const led=trick[0].c.s,wp=kotWinner(trick,tr),cur=trick.find(t=>t.p===wp).c;
  const same=hand.filter(c=>c.s===led);
  if(same.length){
    if(cur.s===tr&&led!==tr)return same;                          // kisi ne kat maar diya: is rang ka patta jeet nahi sakta, koi bhi chalo
    const hi=same.filter(c=>c.r>cur.r);return hi.length?hi:same;  // bada patta ho to bada hi chalna padega
  }
  const tc=hand.filter(c=>c.s===tr);
  if(tc.length){
    if(cur.s===tr){const hi=tc.filter(c=>c.r>cur.r);return hi.length?hi:hand}   // pehle se kat chala hai: usse bada kat chalo; bada kat na ho to koi bhi patta
    return tc}
  return hand;
}
const KotPiece={
  id:'kotpiece',name:'Kot Piece',minPlayers:4,maxPlayers:4,supportsTeams:true,
  team:p=>p%2,
  createInitialState(o={}){
    const st={n:4,round:0,dealer:o.dealer,seed:o.seed,target:o.target||5,score:[0,0],history:[],draw:null};
    if(st.dealer==null){            // sabko ek-ek patta: jise pehle ikka mile wo baantega
      const d=st.seed!=null?sshuffle(newDeck(),st.seed):shuffle(newDeck());st.draw=[];
      for(let i=0;;i++){st.draw.push(d[i]);if(d[i].r===14){st.dealer=i%4;break}}
    }
    return this.deal(st);
  },
  deal(st){
    const d=st.seed!=null?sshuffle(newDeck(),st.seed*31+st.round*7+1):shuffle(newDeck());
    const h=[[],[],[],[]];let idx=0;
    for(const cnt of [5,4,4])for(let k=0;k<4;k++){h[(st.dealer+1+k)%4].push(...d.slice(idx,idx+cnt));idx+=cnt}
    const caller=(st.dealer+1)%4;
    return {...st,hands:h,vis:[5,5,5,5],caller,trump:null,called:false,changer:null,chIdx:0,
      phase:'call',turn:caller,trick:[],played:[],pile:0,pileT:[],chTeam:null,by:null,how:null,tw:[0,0,0,0],last:null,won:[0,0],lastTrick:null,roundInfo:null};
  },
  hand(st,p){return sortHand(st.hands[p].slice(0,st.vis[p]))},   // jitne patte dikhne chahiye
  getValidMoves(st,p){
    if(st.phase==='call')return [0,1,2,3].map(s=>({t:'call',s})).concat([{t:'pass'}]);
    if(st.phase==='change')return [{t:'keep'},{t:'change'}];
    if(st.phase==='newtrump')return [0,1,2,3].filter(x=>x!==st.trump).map(s=>({t:'trump',s})).concat([{t:'keepT'}]);
    if(st.phase==='play')return kotValid(st.hands[p],st.trick).map(c=>({t:'play',c}));
    return [];
  },
  applyMove(st,p,m){
    const s=structuredClone(st),all=()=>{s.vis=[13,13,13,13]};
    const startPlay=()=>{all();s.phase='play';s.turn=s.caller};
    if(m.t==='call'){s.trump=m.s;s.by=p;s.how='call';s.called=true;s.phase='change';s.chIdx=0;s.turn=(s.caller+1)%4;return s}
    if(m.t==='pass'){s.trump=s.hands[s.caller][12].s;s.by=s.caller;s.how='13th';s.called=false;s.phase='change';s.chIdx=0;s.turn=(s.caller+1)%4;return s}   // 13wa patta rang; samne wali team badal sakti hai
    if(m.t==='keep'){s.chIdx++;if(s.chIdx>=2)startPlay();else s.turn=(s.caller+3)%4;return s}
    if(m.t==='change'){s.changer=p;s.vis[p]=13;s.phase='newtrump';return s}   // apne 13 patte dekhega
    if(m.t==='keepT'){s.phase='change';s.changer=null;s.chIdx++;if(s.chIdx>=2)startPlay();else s.turn=(s.caller+3)%4;return s}   // 13 patte dekhe, rang nahi badla
    if(m.t==='trump'){s.trump=m.s;s.by=p;s.how='change';s.chTeam=p%2;startPlay();return s}
    // play
    s.hands[p]=s.hands[p].filter(c=>!(c.s===m.c.s&&c.r===m.c.r));
    s.trick.push({p,c:m.c});s.played.push(m.c);s.turn=(p+1)%4;
    if(s.trick.length<4)return s;
    const w=kotWinner(s.trick,s.trump),tm=w%2;
    s.lastTrick={cards:s.trick,w};s.trick=[];s.turn=w;s.pile++;s.tw[w]++;s.pileT.push(s.lastTrick);
    if(s.last===w){s.won[tm]+=s.pile;s.lastGot=s.pile;s.pile=0;s.pileT=[];s.last=null;
      if(s.chTeam!=null&&tm!==s.chTeam)return kotFin(s,st,tm,true,true)}   // rang badalne ke baad virodhi ne sar uthayi: round khatam, badalne wali team par kot   // lagatar 2 sar: poori pile uthayi
    else{s.last=w;s.lastGot=0}
    if(s.hands.every(h=>!h.length)){
      if(s.pile){s.won[tm]+=s.pile;s.pile=0;s.pileT=[]}                  // bachi hui pile aakhri sar jeetne wale ki
      const wt=s.won[0]>=7?0:1;return kotFin(s,st,wt,s.won[1-wt]===0,false);
    }
    return s;
  },
  nextRound(st){return this.deal({...st,round:st.round+1,dealer:st.nextDealer})},
  isGameOver:st=>st.phase==='over',
  getScores:st=>st.score
};
const KotBots={
  easy:(st,p,mv)=>mv[rand(mv.length)],
  medium(st,p,mv){
    const hand=st.hands[p].slice(0,st.vis[p]);
    const strength=s=>hand.filter(c=>c.s===s).reduce((a,c)=>a+1+(c.r>=12?c.r-10:0)*.5,0);
    const bestSuit=()=>[0,1,2,3].sort((a,b)=>strength(b)-strength(a))[0];
    if(st.phase==='call'){const s=bestSuit();return strength(s)>=5?{t:'call',s}:{t:'pass'}}
    if(st.phase==='change'){
      const s=[0,1,2,3].filter(x=>x!==st.trump).sort((a,b)=>strength(b)-strength(a))[0];
      return strength(s)>=6?{t:'change'}:{t:'keep'}}
    if(st.phase==='newtrump'){const b=bestSuit();return b!==st.trump&&strength(b)>=8&&strength(b)>=strength(st.trump)+3?{t:'trump',s:b}:{t:'keepT'}}
    const tr=st.trump,val=c=>c.r+(c.s===tr?20:0),sorted=mv.slice().sort((a,b)=>val(a.c)-val(b.c));
    if(!st.trick.length){
      const nt=sorted.filter(m=>m.c.s!==tr),ace=nt.filter(m=>m.c.r>=13);
      return st.pile||st.last!=null?(ace[0]||sorted[sorted.length-1]):(nt[0]||sorted[0]);
    }
    const win=m=>kotWinner([...st.trick,{p,c:m.c}],tr)===p;
    const w=sorted.filter(win),partnerWins=kotWinner(st.trick,tr)===(p+2)%4;
    if(partnerWins)return sorted[0];   // saathi ki jeet mat todo
    if(w.length&&(st.pile>0||st.last===p||st.trick.length===3))return w[0];
    return sorted[0];
  }
};
KotBots.hard=KotBots.medium;

/* ============ RANG BID engine (v2) ============
   1) Pehle 5 patte: sirf RANG ki bolti (Kot Piece jaisi). Koi "rang + 5" bolta hai, doosra badhakar (6, 7..) rang cheen sakta hai.
      Jab koi aur na bole to sabse badi bolti wale ka rang trump. Kisi ne na bola to Hukum trump.
   2) Baaki 8 patte baante jate hain (sabke 13).
   3) Asli bid (Call Break jaisi): sab 13 patte dekhkar bid bolte hain. Rang bolne wale ki bid kam se kam uski bolti jitni (5+),

/* anumaan: 13 patte me rang s trump ho to kitni chaal banengi */
function rangEst(hand,s){
  const tr=hand.filter(c=>c.s===s).map(c=>c.r),tn=tr.length;let e=0;
  if(tr.includes(14))e++;if(tr.includes(13)&&tn>=2)e++;if(tr.includes(12)&&tn>=3)e++;if(tr.includes(11)&&tn>=4)e+=.7;
  if(tn>4)e+=tn-4;
  for(let o=0;o<4;o++){if(o===s)continue;const oc=hand.filter(c=>c.s===o);
    if(oc.some(c=>c.r===14))e++;else if(oc.some(c=>c.r===13)&&oc.length>=2)e+=.5;
    if(oc.length===0&&tn>=3)e+=.8;else if(oc.length===1&&tn>=4)e+=.4}
  return e;
}
/* 5 patton me rang ki taakat */
function rangStr(hand,s){return hand.filter(c=>c.s===s).reduce((a,c)=>a+1+(c.r===14?2:c.r===13?1.4:c.r===12?.8:c.r===11?.4:0),0)}

  easy(st,p,mv){

  medium(st,p,mv){
    const hand=st.hands[p].slice(0,st.vis[p]),cnt=s=>hand.filter(c=>c.s===s).length;
    if(st.phase==='call'){
      const best=[0,1,2,3].sort((a,b)=>rangStr(hand,b)-rangStr(hand,a))[0],sp=rangStr(hand,best),hi=st.call.hi;
      if(!hi)return(sp>=4.8&&cnt(best)>=3)?{t:'call',n:5,s:best}:{t:'pass'};

    }

/* chaal chalne ki niti: jeet sakte ho to sabse chhote jeetne wale patte se jeeto (rang na ho to kat maro), warna sabse chhota patta */
function rangPlay(st,p,mv,hand){
  const tr=st.trump,val=c=>c.r+(c.s===tr?20:0),sorted=mv.slice().sort((a,b)=>val(a.c)-val(b.c));
  const need=st.bids[p]-st.won[p],left=hand.length;
  const boss=c=>{for(let r=c.r+1;r<=14;r++)if(!st.played.some(x=>x.s===c.s&&x.r===r)&&!hand.some(x=>x.s===c.s&&x.r===r))return false;return true};
  const win=m=>kotWinner([...st.trick,{p,c:m.c}],tr)===p;
  if(!st.trick.length){                                              // pehli chaal
    const bn=sorted.filter(m=>boss(m.c)&&m.c.s!==tr);if(bn.length)return bn[bn.length-1];          // pakka jeetne wala
    const myTr=hand.filter(c=>c.s===tr).length,bt=sorted.filter(m=>boss(m.c)&&m.c.s===tr);
    if(bt.length&&myTr>=2)return bt[bt.length-1];
    const nt=sorted.filter(m=>m.c.s!==tr);
    if(need>0){                                                       // abhi chaalen chahiye: lambe rang ka bada patta
      if(need>=left)return sorted[sorted.length-1];
      if(nt.length){const len=x=>hand.filter(c=>c.s===x).length;return nt.slice().sort((a,b)=>len(b.c.s)-len(a.c.s)||b.c.r-a.c.r)[0]}
      return sorted[sorted.length-1];
    }
    return nt.length?nt[0]:sorted[0];                                 // bid poori: chhota patta
  }
  return rangFollow(st,p,mv,hand);
}
/* chaal ke jawab me: 1) us rang ka patta ho to chalne wale se BADA patta chalo (jeet sakte ho to)
   2) us rang ka patta na ho to KAT (trump) se kato  3) jeet na sako to sabse chhota/bekaar patta */
function rangFollow(st,p,mv,hand){
  const tr=st.trump,val=c=>c.r+(c.s===tr?20:0),sorted=mv.slice().sort((a,b)=>val(a.c)-val(b.c));
  const led=st.trick[0].c.s,hasLed=hand.some(c=>c.s===led);
  const win=m=>kotWinner([...st.trick,{p,c:m.c}],tr)===p;
  const boss=c=>{for(let r=c.r+1;r<=14;r++)if(!st.played.some(x=>x.s===c.s&&x.r===r)&&!hand.some(x=>x.s===c.s&&x.r===r))return false;return true};
  const w=sorted.filter(win);
  if(hasLed){
    if(w.length){
      if(st.trick.length===3)return w[0];                            // aakhri khiladi: sabse chhota jeetne wala
      const b=w.filter(m=>boss(m.c));return b.length?b[0]:w[w.length-1];   // baaki: pakka ya sabse bada patta
    }
    return sorted[0];                                                // jeet nahi sakte: sabse chhota
  }
  if(w.length)return w[0];                                           // rang nahi: kat (trump) maro, sabse chhote jeetne wale kat se
  const dis=sorted.filter(m=>m.c.s!==tr);                            // kat se bhi nahi jeet sakte: bekaar patta phenko
  return (dis.length?dis:sorted)[0];
}
/* hard: chaal chalte samay anjaane patte bahut baar baantkar (bina dekhe) har chaal ko aazmata hai */
RangBots.hard=function(st,p,mv){
  if(st.phase!=='play'||mv.length<2)return RangBots.medium(st,p,mv);
  if(st.trick.length){                                               // jawab me: jeet sakte ho to sirf jeetne wale patton me se chuno
    const win=m=>kotWinner([...st.trick,{p,c:m.c}],st.trump)===p,wm=mv.filter(win);

  }
  const seen=new Set([...st.hands[p],...st.played,...st.trick.map(t=>t.c)].map(c=>c.s*20+c.r));

  const N=st.hands[p].length>=10?8:st.hands[p].length>=5?12:16,sc=mv.map(()=>0);

    let hh=null;

      const d=shuffle(unseen.slice()),h={},sizes={};let ok=true;
      others.forEach(q=>{h[q]=[];sizes[q]=st.hands[q].length});
      const fr=c=>others.filter(q=>!st.voids[q][c.s]).length;
      d.sort((a,b)=>fr(a)-fr(b));                                  // pehle kam jagah wale patte

      sc[j]+=s.roundScore?s.roundScore[p]:0;
    });
  }
  let bi=0;for(let j=1;j<mv.length;j++)if(sc[j]>sc[bi])bi=j;
  return mv[bi];
};

let CBUF=null,_cl=false;
function loadCard(){   // pehli touch par awaaz decode karke taiyar rakhta hai
  if(_cl||!AC)return;_cl=true;
  try{const bin=atob(CARD_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const p=AC.decodeAudioData(u.buffer,b=>{CBUF=b},()=>{_cl=false});if(p&&p.catch)p.catch(()=>{_cl=false})}catch(e){_cl=false}}
function playCard(v=1.6){   // patta chalte hi: mp3 ki awaaz (halka sa alag pitch har baar)
  if(!sndOn())return;
  if(!CBUF){sip(0,1.5);sip(.11,1);return}   // mp3 abhi decode na hui ho to purani awaaz
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=CBUF;s.playbackRate.value=.96+Math.random()*.1;g.gain.value=v;
  s.connect(g);g.connect(out());s.start(AC.currentTime,.08)}
function dealSnd(){   // patte bantne ki awaaz: pehle tez fent (shuffle), phir ek-ek patta chaaron taraf
  if(!sndOn())return;duckLong(2);
  if(!CBUF){let t=0;for(let i=0;i<13;i++){sip(t,.8+Math.random()*.5);t+=.06+Math.random()*.04}return}
  const T=AC.currentTime+.02,snap=(w,pan,v,rate)=>{const s=AC.createBufferSource(),g=AC.createGain(),pn=AC.createStereoPanner?AC.createStereoPanner():null;
    s.buffer=CBUF;s.playbackRate.value=rate;g.gain.value=v;s.connect(g);if(pn){pn.pan.value=pan;g.connect(pn);pn.connect(out())}else g.connect(out());
    s.start(T+w,.13,.2)};
  for(let i=0;i<7;i++)snap(i*.045,(Math.random()-.5)*.4,.8,1.15+Math.random()*.2);   // fent
  const PAN=[0,.8,0,-.8];
  for(let i=0;i<16;i++)snap(.45+i*.085,PAN[i%4],1.5,.92+Math.random()*.16)}   // baantna
const snd={
  play:()=>{duck();playCard()},   // sip sip   // patta chalna: pehle tez awaaz, phir halki doosri (video jaisi)
  bid:()=>tone(330,.22,.35),
  turn:()=>tone(659,.4,.25),
  win:()=>{duck();tone(523,.5,.8);tone(659,.55,.8,.12);tone(784,.6,.7,.24)},
  deal:()=>dealSnd(),   // phatphat — patte bantne ki awaaz
  tick:(k=1)=>{[0,.19].forEach(w=>{clk(.025,'bandpass',3000,2.2*k,w,1.1);blip(1900,.05,.5*k,w)})},   // tik tik
  err:()=>buzz(),
  end:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.65,.7,i*.18))};
const vib=()=>{if(PG.set.vib&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}};
/* ============ JEET KI DHUN + PATAKHE (teeno games ke final scoreboard par) ============ */
function brass(f,t,d,v){   // turhi / shehnai jaisi tez dhun
  const o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f;o2.detune.value=7;
  fl.type='lowpass';fl.frequency.setValueAtTime(700,t);fl.frequency.linearRampToValueAtTime(3200,t+.08);fl.frequency.exponentialRampToValueAtTime(900,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.setValueAtTime(v*.8,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(out());o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
function duckLong(sec){if(!AC||!MUG)return;const g=MUG.gain,T=AC.currentTime;try{g.cancelScheduledValues(T);g.setTargetAtTime(mGain()*.22,T,.05);g.setTargetAtTime(mGain(),T+sec,.4)}catch(e){}}
function dhol(w,v=1){thump(150,52,.2,1.5*v,w);clk(.05,'lowpass',900,.8*v,w,.8)}
function fanfare(){   // jeet ki dhun: dhol + turhi
  if(!sndOn())return;duckLong(8);const T=AC.currentTime+.05;
  [[0,3],[.3,3],[.6,3],[.9,2],[1.2,2],[1.5,2],[1.8,3],[2.1,3],[2.4,3],[2.7,2]].forEach(([w,x])=>{dhol(w,x===3?1:.75)});   // dhol ki tak-dhin
  for(let i=0;i<16;i++)dhol(3+i*.3,i%2?.6:1);
  [[523,0,.28],[523,.3,.28],[659,.6,.28],[784,.9,.55],[659,1.5,.28],[784,1.8,.28],[1047,2.1,.9],
   [880,3.2,.3],[784,3.5,.3],[880,3.8,.3],[1047,4.1,.5],[1175,4.7,.3],[1319,5,.3],[1568,5.3,1.4]]
   .forEach(([f,w,d])=>brass(f,T+w,d,.32));
  [[262,0,1.4],[330,0,1.4],[392,0,1.4],[349,3.2,1.8],[440,3.2,1.8],[262,5.3,2],[330,5.3,2],[392,5.3,2]].forEach(([f,w,d])=>brass(f,T+w,d,.12));}
function boom(v=1){   // patakhe ka dhamaka + chatar-patar
  if(!sndOn())return;thump(130,30,.5,1.7*v);nz(.55,'lowpass',1100,110,.55*v,0,.7);
  for(let i=0;i<10;i++)clk(.035,'highpass',3200+Math.random()*3500,.9*v*(.4+Math.random()),.06+Math.random()*.5,.8)}
function whistle(){   // rocket upar jaane ki seeti
  if(!sndOn())return;const T=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(500,T);o.frequency.exponentialRampToValueAtTime(1900,T+.7);
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(.16,T+.1);g.gain.linearRampToValueAtTime(0,T+.72);

        :T('अभी बड़ा पत्ता खर्च मत कीजिए। छोटा पत्ता चलिए, बड़े पत्ते बाद में काम आएँगे।',`Don't spend a high card yet. Lead low and save your big cards for later.`);
      c=T('हाथ शुरू करते समय आप कोई भी पत्ता चल सकते हैं।','When you lead, any card is allowed.');

        :T('आपकी बिड पूरी है, इसलिए हाथ हारना ठीक है। बड़ा पत्ता अभी निकाल दीजिए, वरना वह बाद में अनचाहा हाथ जिता देगा।',`Your bid is met, so losing this trick is fine. Dump a high card now so it cannot win by accident later.`);

    }

/* game flow */
function act(p,m){
  clearTimeout(ui.timer);ui.forced=0;
  if(ON.active){onlineSend(m);return}
  const done=G.phase==='play'&&G.trick.length===G.n-1;
  if(p===0&&G.practice){(ui.hist=ui.hist||[]).push(G);feedback(m)}
  if(p===0&&m.t==='play')vib();
  ui.hint=null;
  m.t==='play'?snd.play():snd.bid();
  G=CallBreak.applyMove(G,p,m);
  if(G.phase==='over')recordResult();
  if(done){
    ui.hold=true;ui.show=G.lastTrick;render();setTimeout(snd.win,350);
    const gg=G;setTimeout(()=>{if(G!==gg)return;ui.hold=false;ui.show=null;render();step();if(G.phase==='roundEnd')autoNext()},1400);   // Home dabane par na atke
  }else{render();step()}
}
function step(){
  clearTimeout(ui.timer);
  if(ON.active){onlineStep();return}
  if(!G||ui.hold||ui.modal||!['bid','play'].includes(G.phase)){ui.dur=0;return}
  const p=G.turn,g=G,human=p===0;
  ui.forced=0;
  if(human&&G.phase==='play'){const mv0=CallBreak.getValidMoves(G,0);
    if(mv0.length===1){   // sirf ek hi patta chal sakta hai (aakhri patta bhi): apne aap chal jaye
      ui.forced=1;ui.dur=0;ui.fb=null;ui.hint=G.practice&&PG.set.coach?computeHint():null;render();snd.turn();
      ui.timer=setTimeout(()=>{if(G!==g||ui.hold||ui.modal)return;act(0,mv0[0])},G.practice?2600:900);return}}
  if(human&&G.practice){ui.dur=0;ui.fb=null;ui.hint=PG.set.coach?computeHint():null;render();snd.turn();return}   // practice: koi timer nahi
  ui.t0=Date.now();
  ui.dur=human?(G.phase==='play'?HUMAN_MS:10000):(G.phase==='bid'?1000+rand(600):BOT_MIN+rand(BOT_MAX-BOT_MIN));
  render();if(human)snd.turn();
  ui.timer=setTimeout(()=>{
    if(G!==g||ui.hold||ui.modal)return;
    const mv=CallBreak.getValidMoves(G,p);
    act(p,human?Bots.medium(G,p,mv):Bots[G.daily?'medium':PG.set.level](G,p,mv));   // aapka time khatam: auto-play
  },ui.dur);
}

function trText(k){const d=TR[k];if(d)return d[li()];for(const [re,h,e] of PT){const m=k.match(re);if(m)return (li()?e:h)(m)}return k}
function trNode(n){
  if(n.nodeType===3){const o=n.nodeValue,k=o.trim();if(k){const r=trText(k);if(r!==k)n.nodeValue=o.replace(k,()=>r)}return}
  if(n.nodeType!==1)return;
  [n,...n.querySelectorAll('[placeholder]')].forEach(e=>{if(e.hasAttribute('placeholder'))e.setAttribute('placeholder',trText(e.getAttribute('placeholder')))});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(trNode);
}
new MutationObserver(ms=>ms.forEach(x=>x.addedNodes.forEach(trNode))).observe($,{childList:true,subtree:true});

function onConnect(then){
  const url=serverUrl();if(!url){flash(T2('पहले सर्वर का पता डालिए','Enter the server address first'));return}
  if(ON.ws&&ON.ws.readyState===1&&ON.ok){if(then)then();return}
  if(ON.ws&&ON.ws.readyState===0){ON.then=then;return}
  let w;try{w=new WebSocket(url)}catch(e){flash(T2('सर्वर का पता सही नहीं है','The server address is not valid'));return}
  ON.ws=w;ON.then=then;clearTimeout(ON.ct);
  ON.ct=setTimeout(()=>{   // server na mile to hamesha na atke
    if(ON.ws!==w||w.readyState===1)return;w._dead=1;try{w.close()}catch(e){}ON.ws=null;ON.ok=false;
    if(ON.active||ON.room)onReconnect();else{if(ON.then){ON.then=null;flash(T2('सर्वर से जुड़ नहीं पाए','Could not connect to the server'))}refreshBox()}},ON.cto);
  w.onopen=()=>w.send(JSON.stringify({t:'hello',name:me().name,e:myEmoji(),token:tokGet()}));
  w.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onMsg(m)};
  w.onclose=()=>{if(w._dead)return;clearTimeout(ON.ct);ON.ok=false;ON.ws=null;
    if(ON.active||ON.room)onReconnect();
    else{if(ON.then){ON.then=null;flash(T2('सर्वर से जुड़ नहीं पाए','Could not connect to the server'))}refreshBox()}};
  w.onerror=()=>{};
}
function onReconnect(){
  if(ON.tries++>8){flash(T2('सर्वर से कनेक्शन टूट गया','Connection to the server was lost'));const was=ON.active;ON.room=null;ON.active=false;if(was)home();return}
  flash(T2('फिर से जुड़ रहे हैं…','Reconnecting…'));setTimeout(()=>{if(ON.room||ON.active)onConnect()},2000);
}
function onMsg(m){
  if(m.t==='hi'){clearTimeout(ON.ct);ON.ok=true;ON.tries=0;
    if((ON.active||ON.room)&&!m.resumed){   // server par ab wo room/game nahi raha
      const was=ON.active;ON.room=null;ON.active=false;ON.q=[];flash(T2('वह गेम ख़त्म हो चुका है','That game is no longer running'));if(was)home();else{BOXFN=PG.set.game==='kot'?kotOnlineHTML:PG.set.game==='rang'?rangOnlineHTML:onlineHTML;refreshBox()}}
    try{localStorage.setItem('pg_tok',m.token)}catch(e){}const f=ON.then;ON.then=null;if(f)f();refreshBox();return}
  if(m.t==='room'){
    ON.room=m;ON.seat=m.you;ON.seats=m.seats;
    const gk=m.game==='kot'?'kot':m.game==='rang'?'rang':'cb';if(PG.set.game!==gk)PG.set.game=gk;   // kisi bhi game ka code dalo, sahi game khulega
    if(m.phase==='lobby'){if(ON.active){ON.keep=1;ON.active=false;home();ON.keep=0}showRoom()}
    else if(ON.active&&(G||KG||RG)){setBots()}
    return}
  if(m.t==='state'){if(ON.room){if(ON.room.game==='kot')kOnState(m);else if(ON.room.game==='rang')rOnState(m);else onState(m)}return}
  if(m.t==='emo'){onEmo(m);return}
  if(m.t==='err'){ON.pending=0;if(KU)KU.pend=0;if(RU)RU.pend=0;const e=ERR[m.code];flash(e?T2(e[0],e[1]):m.msg);return}
}

function rot(m){
  const g=m.G,n=g.n,s=m.seat,R=a=>a.map((_,i)=>a[(i+s)%n]),L=p=>(p-s+n)%n;

let KTM=0;
function kRot(m){
  const g=m.G,s=m.seat,R=a=>a.map((_,i)=>a[(i+s)%4]),L=p=>p==null?p:(p-s+4)%4,Tm=a=>s%2?[a[1],a[0]]:a.slice(),tm=t=>t==null?t:(t+s)%2;
  const rt=t=>t?{cards:t.cards.map(x=>({p:L(x.p),c:x.c})),w:L(t.w)}:t;
  const o={...g,hands:R(g.hands),vis:R(g.vis),tw:R(g.tw),won:Tm(g.won),score:Tm(g.score),dealer:L(g.dealer),caller:L(g.caller),turn:L(g.turn),
    changer:L(g.changer),by:L(g.by),last:L(g.last),chTeam:tm(g.chTeam),nextDealer:L(g.nextDealer),trick:g.trick.map(x=>({p:L(x.p),c:x.c})),
    pileT:g.pileT.map(rt),lastTrick:rt(g.lastTrick),history:g.history.map(h=>({...h,won:Tm(h.won),wt:tm(h.wt)}))};
  if(g.roundInfo)o.roundInfo={...g.roundInfo,wt:tm(g.roundInfo.wt),chBy:L(g.roundInfo.chBy)};
  return o;
}
function kOnEnter(m){
  const o=document.getElementById('pk');if(o)o.remove();ui.modal=null;
  ON.active=true;clearTimeout(KU.t);kotCloseOv();
  KU={online:true,q:[],tn:m.tn,pend:0,dl:m.ms,t0:Date.now(),show:null,busy:false,practice:false,daily:false,rec:false,fee:0,reward:0,hist:[],endKey:''};
  KG=kRot(m);setBots();$.className='kot';snd.deal();kotRender();kStartTimer();kPost();
  flash(pn(KG.dealer)+' '+T2('पत्ते बाँटेगा','deals')+' · '+pn(KG.caller)+' '+T2('रंग बोलेगा','names the trump'));
}
function kOnState(m){if(!ON.active||!KU.online){kOnEnter(m);return}KU.q.push(m);kDrain()}
function kDrain(){while(KU.q.length&&!KU.busy)kApply(KU.q.shift())}
function kApply(m){
  const prev=KG,ng=kRot(m);KU.pend=0;KU.dl=m.ms;KU.t0=Date.now();
  const tcomp=m.tn>KU.tn;KU.tn=m.tn;KG=ng;setBots();
  if(prev&&ng.round>prev.round)snd.deal();
  if(prev&&ng.trick.length>prev.trick.length&&ng.trick[ng.trick.length-1].p!==0)snd.play();
  if(tcomp&&ng.lastTrick){
    const w=ng.lastTrick.w,tmn=w%2?T2('विरोधी टीम','the opponents'):T2('आपकी टीम','your team');
    KU.note=ng.lastGot>0?`🎉 ${pn(w)} ${T2('ने लगातार 2 सर जीतीं — पूरी','won 2 in a row — all')} <b>${ng.lastGot}</b> ${T2('सर उठाईं','tricks taken')} (${tmn})`:`${pn(w)} ${T2('ने सर जीती','won the trick')}<small>${T2('📦 जमा हुई, अभी किसी को नहीं मिली','kept in the 📦 pile, nobody has it yet')}</small>`;
    snd.win();if(w===0)vib([30,40,30]);
    KU.show=ng.lastTrick;KU.busy=true;kotRender();const gg=KG,id=KU;
    KU.t=setTimeout(()=>{if(KU!==id||KG!==gg)return;KU.show=null;KU.busy=false;kotRender();kPost();kDrain()},2200);
  }else{kotRender();kPost()}
}
function kPost(){
  const g=KG;if(!g||KU.busy)return;
  if(g.phase==='roundEnd'||g.phase==='over'){const key=g.round+':'+g.phase;if(KU.endKey!==key){KU.endKey=key;kotEnd()}return}
  if(KU.endKey){KU.endKey='';kotCloseOv()}
  if(g.turn===0){snd.turn();vib(20)}
}
function kStartTimer(){
  clearInterval(KTM);
  KTM=setInterval(()=>{
    if(!KU.online||!KG){clearInterval(KTM);return}
    const e=document.getElementById('ktm');if(!e)return;
    const sec=Math.max(0,Math.ceil((KU.dl-(Date.now()-KU.t0))/1000));
    e.textContent=(KG.turn===0&&!KU.busy&&['call','change','newtrump','play'].includes(KG.phase))?'⏱ '+sec:'';
  },500);
}
function kOnSend(m){
  if(KU.pend||KU.busy||!KG||KG.turn!==0)return;KU.pend=1;setTimeout(()=>{if(KU)KU.pend=0},2500);
  if(m.t==='play')snd.play();else snd.bid();
  const o=m.t==='play'?{t:'play',c:{s:m.c.s,r:m.c.r}}:(m.t==='call'||m.t==='trump')?{t:m.t,s:m.s}:{t:m.t};
  onSend({t:'move',m:o});
}

function kotRecord(win){
  if(KU.rec||KU.practice)return;KU.rec=true;
  const u=me(),g=KG,kots=g.history.filter(h=>h.kot&&h.wt===0).length;u.kot=u.kot||{played:0,won:0,kots:0,pts:0};
  const add=()=>{u.kot.played++;if(win)u.kot.won++;u.kot.kots+=kots;u.kot.pts+=g.score[0]};
  if(KU.online){const kk='kot'+onKind(),o=u[kk]=u[kk]||{played:0,won:0,kots:0,pts:0};o.played++;if(win)o.won++;o.kots+=kots;o.pts+=g.score[0];save();return}   // online: alag leaderboard, 💎 ka len-den nahi
  if(!KU.daily){add();if(win){KU.reward=KOT_WIN+(kots>0?KOT_KOT:0);u.gems=(u.gems||0)+KU.reward}save();return}
  const t=today(),first=!(u.kotDaily&&u.kotDaily.date===t),my=g.won[0];   // daily: roz pehli baar hi ginti me, baad me sirf best score
  u.kotDaily={date:t,score:first?my:Math.max(u.kotDaily.score,my)};
  KU.dres={best:u.kotDaily.score,first,bonus:0};
  if(first){add();if(u.kotPaid!==t){u.kotPaid=t;u.gems=(u.gems||0)+25;KU.dres.bonus=25}}
  save();
}

function kCoach(g){   // practice: kya chalna hai aur kyon (bot wali soch se)
  if(!KU.practice||g.turn!==0||KU.busy||KU.show||g.phase==='roundEnd'||g.phase==='over')return null;
  const mv=KotPiece.getValidMoves(g,0);if(!mv.length)return null;
  const m=KotBots.medium(g,0,mv),hand=g.hands[0].slice(0,g.vis[0]),nm=c=>rankName(c.r)+SUITS[c.s],sn=x=>SUITS[x]+' '+SUITN[x][li()];
  const cnt=x=>hand.filter(c=>c.s===x).length,big=x=>hand.filter(c=>c.s===x&&c.r>=12).length;
  const oth=[0,1,2,3].filter(x=>x!==g.trump).sort((x,y)=>cnt(y)+big(y)-cnt(x)-big(x))[0];
  let a,b,c='';
  if(g.phase==='call'){
    if(m.t==='call'){a=T2('कट बोलिए: '+sn(m.s),'Name the trump: '+sn(m.s));b=T2(`आपके 5 पत्तों में ${sn(m.s)} के ${cnt(m.s)} पत्ते हैं (A/K/Q बड़े: ${big(m.s)})। जिस रंग के ज़्यादा और बड़े पत्ते हों, वही कट बनाइए — कट वाला पत्ता बाकी रंगों से सर जीतता है।`,`You hold ${cnt(m.s)} cards of ${sn(m.s)} in your 5 (${big(m.s)} big: A/K/Q). Name your longest, strongest suit — a trump beats the other suits.`)}
    else{a=T2('"नहीं बोलूँगा" चुनिए','Choose "Pass"');b=T2('5 पत्तों में कोई रंग ज़्यादा मज़बूत नहीं है। ऐसे में आपके 13वें पत्ते का रंग ही कट बनेगा।','No suit is clearly strong in your 5 cards, so the suit of your 13th card becomes the trump.')}
    c=T2('ध्यान रहे: विरोधी 13 पत्ते देखकर कट बदल सकते हैं, पर बदलने के बाद वे एक भी सर उठवा बैठे तो उन पर कोट लगता है।','Opponents may change the trump after seeing 13 cards, but if you then collect even once they get Kot.');
  }else if(g.phase==='change'){
    if(m.t==='change'){a=T2('"13 पत्ते उठाओ" दबाइए','Press "Take all 13"');b=T2(`आपके पास ${sn(oth)} में दम है (${cnt(oth)} पत्ते, ${big(oth)} बड़े)। 13 पत्ते देखने के बाद ही बदलने का फैसला कीजिए।`,`Your ${sn(oth)} looks strong (${cnt(oth)} cards, ${big(oth)} big). Decide only after seeing all 13.`)}
    else{a=T2('"नहीं" चुनिए','Choose "No"');b=T2('अभी दूसरे रंग में खास दम नहीं दिखता। बेवजह जोखिम न लें।','No other suit looks strong yet. Do not take a needless risk.')}
    c=T2('रंग बदलने के बाद विरोधी एक भी बार सर उठा लें तो राउंड वहीं खत्म और आप पर कोट।','If you change and the opponents collect even once, the round ends and you get Kot.');
  }else if(g.phase==='newtrump'){
    if(m.t==='trump'){a=T2('नया कट: '+sn(m.s),'New trump: '+sn(m.s));b=T2(`13 पत्तों में ${sn(m.s)} के ${cnt(m.s)} पत्ते हैं (बड़े: ${big(m.s)}) — हाथ काफ़ी मज़बूत है।`,`You hold ${cnt(m.s)} cards of ${sn(m.s)} (${big(m.s)} big) — a strong hand.`)}
    else{a=T2('"रंग वही रखो" चुनिए','Choose "Keep the same trump"');b=T2('13 पत्ते देखकर भी कोई दूसरा रंग इतना मज़बूत नहीं कि बदलने का जोखिम लिया जाए।','Even with 13 cards no other suit is strong enough to justify the risk.')}
    c=T2('बदलने पर विरोधी एक भी सर उठा लें तो आप हार जाएँगे और कोट लगेगा।','If you change and the opponents collect once, you lose with Kot.');
  }else{
    const lead=!g.trick.length,cur=lead?null:kotWinner(g.trick,g.trump),pw=cur===2,win=!lead&&kotWinner([...g.trick,{p:0,c:m.c}],g.trump)===0;
    a=T2('यह पत्ता चलिए: '+nm(m.c),'Play this card: '+nm(m.c));
    if(lead)b=g.last===0?T2('आपने पिछली सर जीती थी। अब यह सर भी जीती तो जमा सारी सर आपकी टीम की हो जाएँगी — बड़ा पत्ता चलिए।','You won the last trick. Win this one too and you collect the whole pile — lead high.'):g.pile>0?T2('सर जमा हैं पर आपकी लगातार जीत नहीं चल रही। बड़ा पत्ता चलकर सर जीतने की कोशिश कीजिए।','Tricks are in the pile but you are not on a streak. Lead high and try to win.'):T2('अभी कोई सर जमा नहीं है — छोटा पत्ता चलकर बड़े पत्ते बचाइए।','No pile yet — lead low and save your big cards.');
    else if(pw)b=T2('आपका साथी जीत रहा है। उसे मत दबाइए — छोटा पत्ता चलिए, ताकि वह लगातार 2 सर जीतकर जमा सर उठा सके।','Your partner is winning. Do not beat him — play low so he can win two in a row and collect the pile.');
    else if(win)b=T2('यह पत्ता अभी सर जीत सकता है। अगली सर भी आप ही जीतें तो जमा सारी सर उठा लेंगे।','This card can win the trick. Win the next one too and you take the whole pile.');
    else b=T2('यह सर जीतना मुश्किल है — सबसे छोटा पत्ता चलिए और कट/बड़े पत्ते बचाइए।','Hard to win this trick — play your lowest card and save trumps and big cards.');
    c=(!lead&&!hand.some(x=>x.s===g.trick[0].c.s))?T2('इस रंग का पत्ता नहीं है, इसलिए कोई भी पत्ता चल सकता है; कट लगाना ज़रूरी नहीं।','You have no card of this suit, so any card is allowed; trumping is not compulsory.'):T2(`📦 ${g.pile} सर जमा हैं। सर तभी उठती है जब एक ही खिलाड़ी लगातार 2 सर जीते।`,`📦 ${g.pile} tricks in the pile. They are collected only when one player wins 2 in a row.`);
  }
  return {m,a,b,c,t:a};
}

  }else{

      :(need>0&&kotWinner([...g.trick,{p:0,c:m.c}],g.trump)===0?T2('यह पत्ता चाल जीत सकता है और आपको चालें चाहिए।','This card can win the trick and you need tricks.'):T2('यह चाल जीतना मुश्किल या ज़रूरी नहीं — सबसे छोटा पत्ता चलिए।','Hard (or not needed) to win this trick — play your lowest.'));

  }

  RU={online:true,q:[],tn:m.tn,pend:0,dl:m.ms,t0:Date.now(),dur:Math.max(300,m.ms),show:null,busy:false,practice:false,daily:false,rec:false,fee:0,reward:0,endKey:''};
  RG=rRot(m);setBots();RB={n:0,s:null};$.className='kot';snd.deal();rangRender();rOnPost();
}
function rOnState(m){if(!ON.active||!RU.online){rOnEnter(m);return}RU.q.push(m);rDrain()}
function rDrain(){while(RU.q.length&&!RU.busy)rApply(RU.q.shift())}
function rApply(m){
  const prev=RG,ng=rRot(m);RU.pend=0;RU.dl=m.ms;RU.t0=Date.now();RU.dur=Math.max(300,m.ms);
  const tcomp=m.tn>RU.tn;RU.tn=m.tn;RG=ng;setBots();
  if(prev&&ng.round>prev.round)snd.deal();
  if(prev&&ng.trick.length>prev.trick.length&&ng.trick[ng.trick.length-1].p!==0)snd.play();
  if(tcomp&&ng.lastTrick){
    RU.note=`${pn(ng.lastTrick.w)} ${T2('ने चाल जीती','won the trick')}`;snd.win();if(ng.lastTrick.w===0)vib([30,40,30]);
    RU.show=ng.lastTrick;RU.busy=true;rangRender();const gg=RG,id=RU;
    RU.t=setTimeout(()=>{if(RU!==id||RG!==gg)return;RU.show=null;RU.busy=false;rangRender();rOnPost();rDrain()},2200);
  }else{rangRender();rOnPost()}
}
function rOnPost(){
  const g=RG;if(!g||RU.busy)return;
  if(g.phase==='roundEnd'||g.phase==='over'){const key=g.round+':'+g.phase;if(RU.endKey!==key){RU.endKey=key;rangEnd()}return}
  if(RU.endKey){RU.endKey='';clearInterval(RU.cd);rangCloseOv()}
  if(g.turn===0){snd.turn();vib(20)}
}
function rOnSend(m){
  if(RU.pend||RU.busy||!RG||RG.turn!==0)return;RU.pend=1;setTimeout(()=>{if(RU)RU.pend=0},2500);
  if(m.t==='play')snd.play();else{snd.bid();RB={n:0,s:null}}
  const o=m.t==='play'?{t:'play',c:{s:m.c.s,r:m.c.r}}:m.t==='pass'?{t:'pass'}:{t:m.t,n:m.n,...(m.s!=null?{s:m.s}:{})};
  onSend({t:'move',m:o});
}
