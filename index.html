<script>
/* ============ 1. CARD LIBRARY ============ */
const SUITS=['♠','♥','♣','♦'];           // 0 = Spade (always trump in Call Break)
const RANKS={11:'J',12:'Q',13:'K',14:'A'};
const rankName=r=>RANKS[r]||r;
function rand(n){const b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]%n}
function newDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({s,r});return d}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortHand(h){return h.slice().sort((a,b)=>a.s-b.s||b.r-a.r)}

/* ============ 2. GAME: CALL BREAK ============
   Naya game add karna ho to isi tarah ek object banao aur Registry me daal do.
   Interface: id, name, createInitialState, getValidMoves, applyMove, isGameOver, getScores */
function trickWinner(trick){
  const ls=trick[0].c.s;let best=trick[0];
  for(const t of trick.slice(1)){
    const a=t.c,b=best.c;
    if(a.s===b.s?a.r>b.r:(a.s===0&&b.s!==0))best=t;
  }
  return best.p;
}
function validCards(hand,trick){
  if(!trick.length)return hand;
  const ls=trick[0].c.s,wp=trickWinner(trick),wc=trick.find(t=>t.p===wp).c;
  const same=hand.filter(c=>c.s===ls);
  if(same.length){
    if(wc.s===ls){const hi=same.filter(c=>c.r>wc.r);return hi.length?hi:same}
    return same;
  }
  const sp=hand.filter(c=>c.s===0);
  if(sp.length){
    if(wc.s===0){const hi=sp.filter(c=>c.r>wc.r);return hi.length?hi:hand}   // EASY niyam: bada hukum na ho to koi bhi patta chal sakta hai
    return sp;
  }
  return hand;
}
const CallBreak={
  id:'callbreak',name:'Call Break',minPlayers:4,maxPlayers:6,supportsTeams:false,ROUNDS:5,
  createInitialState(o={}){const n=o.players||4,t=o.target||0;return this.deal({n,hpp:n===4?13:n===5?10:8,round:0,rounds:t?0:(o.rounds||5),target:t,dealer:0,totals:Array(n).fill(0),history:[],seed:o.seed})},
  deal(st){
    const n=st.n,hpp=st.hpp;let h,k=0;do{let d=st.seed!=null?sshuffle(newDeck(),st.seed*31+st.round*7+(k++)):shuffle(newDeck());
      d=d.filter(c=>!(c.r===2&&(n===6||(n===5&&(c.s===2||c.s===3)))));   // 5 khiladi: 2♣,2♦ hate; 6 khiladi: chaaron 2
      h=Array.from({length:n},(_,i)=>sortHand(d.slice(i*hpp,i*hpp+hpp)))}
    while(h.some(x=>!x.some(c=>c.s===0)));          // kisi ke paas spade na ho to auto redeal
    return {...st,hands:h,bids:Array(n).fill(null),won:Array(n).fill(0),trick:[],played:[],turn:(st.dealer+1)%n,phase:'bid',lastTrick:null,roundScore:null};
  },
  getValidMoves(st,p){
    if(st.phase==='bid')return Array.from({length:st.hpp},(_,i)=>({t:'bid',n:i+1}));
    if(st.phase==='play')return validCards(st.hands[p],st.trick).map(c=>({t:'play',c}));
    return [];
  },
  applyMove(st,p,m){
    const s=structuredClone(st);
    if(m.t==='bid'){
      s.bids[p]=m.n;s.turn=(p+1)%s.n;
      if(s.bids.every(b=>b!==null)){s.phase='play';s.turn=(s.dealer+1)%s.n}
      return s;
    }
    s.hands[p]=s.hands[p].filter(c=>!(c.s===m.c.s&&c.r===m.c.r));
    s.trick.push({p,c:m.c});s.played.push(m.c);s.turn=(p+1)%s.n;
    if(s.trick.length===s.n){
      const w=trickWinner(s.trick);s.won[w]++;s.lastTrick={cards:s.trick,w};s.trick=[];s.turn=w;
      if(s.hands.every(h=>!h.length)){
        const mul={4:1,5:1.5,6:2}[s.n];   // chhote haath me score dheere badhta hai, isliye 5 khiladi x1.5, 6 khiladi x2
        s.roundScore=s.bids.map((b,i)=>Math.round((s.won[i]>=b?b+(s.won[i]-b)*.1:-b)*mul*10)/10);
        s.totals=s.totals.map((t,i)=>Math.round((t+s.roundScore[i])*10)/10);
        s.history.push({bids:s.bids,won:s.won,score:s.roundScore});
        const fin=s.target?(Math.max(...s.totals)>=s.target||s.round+1>=15):(s.round+1>=s.rounds);   // target mode: sabse pehle 11/21 par pahunchne wala
        s.phase=fin?'over':'roundEnd';
      }
    }
    return s;
  },
  nextRound(st){return this.deal({...st,round:st.round+1,dealer:(st.dealer+1)%st.n})},
  isGameOver:st=>st.phase==='over',
  getScores:st=>st.totals
};
const Registry={callbreak:CallBreak};   // yahin Rummy, Teen Patti, ... register honge

/* ============ 3. BOTS ============ */
const Bots={
  easy:(st,p,mv)=>mv[rand(mv.length)],
  medium(st,p,mv){
    const hand=st.hands[p];
    if(st.phase==='bid'){
      let n=0;const sp=hand.filter(c=>c.s===0);
      sp.forEach(c=>{n+=c.r>=13?1:c.r>=11?.6:c.r>=8?.3:.15});
      for(let s=1;s<4;s++){
        const cs=hand.filter(c=>c.s===s);
        if(cs.some(c=>c.r===14))n+=.9;
        if(cs.some(c=>c.r===13)&&cs.length>=2)n+=.5;
        if(cs.length<=1&&sp.length>=3)n+=.4;       // chhota suit = spade se kaat sakte hain
      }
      const b=Math.max(1,Math.min(8,mv.length,Math.floor(n)));
      return mv.find(m=>m.n===b);
    }
    const need=st.won[p]<st.bids[p],val=c=>c.r+(c.s===0?20:0);
    const sorted=mv.slice().sort((a,b)=>val(a.c)-val(b.c));
    // boss = isse bada patta ab kisi ke paas nahi (khela ja chuka ya mere paas hai)
    const boss=c=>{for(let r=c.r+1;r<=14;r++)if(!st.played.some(x=>x.s===c.s&&x.r===r)&&!hand.some(x=>x.s===c.s&&x.r===r))return false;return true};
    if(!st.trick.length){                         // chal shuru karna
      if(need){
        const b=sorted.filter(m=>boss(m.c)&&m.c.s!==0);if(b.length)return b[b.length-1];
        const bs=sorted.filter(m=>boss(m.c)&&m.c.s===0);if(bs.length)return bs[0];
      }
      const ns=sorted.filter(m=>m.c.s!==0);
      return ns.length?ns[0]:sorted[0];           // warna sabse chhota non-spade
    }
    const win=m=>trickWinner([...st.trick,{p,c:m.c}])===p;
    const w=sorted.filter(win),l=sorted.filter(m=>!win(m));
    if(need&&w.length)return w[0];                // hath chahiye: sabse chhote patte se jeeto
    return l.length?l[0]:sorted[0];               // warna chhota patta phenko
  }
,
  hard(st,p,mv){
    const hand=st.hands[p];
    if(st.phase==='bid'){
      const sp=hand.filter(c=>c.s===0);let n=0;
      sp.forEach((c,i)=>{n+=c.r===14?1:c.r===13?(sp.length>1?.9:.4):c.r===12?(sp.length>2?.7:.3):c.r===11?.4:i>=3?.5:.25});
      for(let s=1;s<4;s++){const cs=hand.filter(c=>c.s===s);
        if(cs.some(c=>c.r===14))n+=.85;
        if(cs.some(c=>c.r===13)&&cs.length>=2&&cs.length<=4)n+=.45;
        if(cs.length===0&&sp.length>=2)n+=.7;else if(cs.length===1&&sp.length>=3)n+=.4}
      const b=Math.max(1,Math.min(9,mv.length,Math.round(n)));return mv.find(m=>m.n===b);
    }
    const left=hand.length,need=st.bids[p]-st.won[p],val=c=>c.r+(c.s===0?20:0);
    const sorted=mv.slice().sort((a,b)=>val(a.c)-val(b.c));
    const boss=c=>{for(let r=c.r+1;r<=14;r++)if(!st.played.some(x=>x.s===c.s&&x.r===r)&&!hand.some(x=>x.s===c.s&&x.r===r))return false;return true};
    const ns=sorted.filter(m=>m.c.s!==0);
    if(!st.trick.length){
      if(need>=left)return sorted[sorted.length-1];                 // baaki sab hath chahiye
      if(need>0){
        const b=ns.filter(m=>boss(m.c));if(b.length)return b[b.length-1];
        const bs=sorted.filter(m=>boss(m.c)&&m.c.s===0);if(bs.length)return bs[bs.length-1];
        return ns.length?ns[0]:sorted[0];
      }
      const safe=ns.filter(m=>!boss(m.c));                          // bid poori: jeetne se bacho
      return safe.length?safe[0]:(ns.length?ns[0]:sorted[0]);
    }
    const win=m=>trickWinner([...st.trick,{p,c:m.c}])===p;
    const w=sorted.filter(win),l=sorted.filter(m=>!win(m));
    if(need>0&&w.length)return need>=left?w[w.length-1]:w[0];
    if(l.length)return need>0?l[0]:l[l.length-1];                   // bid poori ho gayi: bade patte nikalo
    return sorted[0];
  }

};

function pickBots(k=3){const a=POOL.slice(),r=[];while(r.length<k){const x=a.splice(rand(a.length),1)[0],f=FACE[x[2]];r.push({n:[x[0],x[1]],e:f[rand(f.length)]})}return r}

function out(){if(!MG){MG=AC.createGain();MG.gain.value=gainOf();const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;MG.connect(lp);lp.connect(AC.destination)}return MG}
function tone(f,d,v=.05,w=0){   // narm ghanti (sine + halka octave)
  if(!sndOn())return;const T=AC.currentTime+w,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
  o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=.12;
  g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.03);g.gain.exponentialRampToValueAtTime(.0005,T+d);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(out());o.start(T);o2.start(T);o.stop(T+d+.05);o2.stop(T+d+.05)}
function nz(d,type,f0,f1,v,w=0,q=.7){   // filtered shor (brush / thud)
  if(!sndOn())return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++){const t=i/n;x[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*t),2)}
  const T=AC.currentTime+w,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,T);f.frequency.exponentialRampToValueAtTime(f1,T+d);
  g.gain.value=v*2;s.buffer=b;s.connect(f);f.connect(g);g.connect(out());s.start(T)}

function dragStart(e,el,card){   // patte ko ungli se pakadkar upar mez ki taraf kheenchiye
  e.preventDefault();
  const pm=PG.set.playmode||'drag',x0=e.clientX,y0=e.clientY,tr=document.querySelector('.trick');let moved=false;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  el.style.transition='none';el.style.zIndex=60;
  const st=(dx,dy)=>FIT.port?[dy/FIT.k,-dx/FIT.k]:[dx/FIT.k,dy/FIT.k];   // screen -> stage (ghoomi hui screen me bhi)
  el.onpointermove=ev=>{const [sx,sy]=st(ev.clientX-x0,ev.clientY-y0);if(Math.abs(sx)+Math.abs(sy)>12)moved=true;
    if(pm!=='tap'){el.style.transform=`translate(${sx}px,${sy-16}px) scale(1.12) rotate(${Math.max(-18,Math.min(18,sx/14))}deg)`;if(tr)tr.classList.toggle('drop',sy<-60)}};
  const end=ev=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;if(tr)tr.classList.remove('drop');
    const [sx,sy]=st(ev.clientX-x0,ev.clientY-y0);
    const play=ev.type==='pointerup'&&((moved&&pm!=='tap'&&sy<-70)||(!moved&&pm!=='drag'));
    if(play){if(ON.active)el.style.opacity='.45';act(0,{t:'play',c:card});return}
    el.style.transition='transform .2s';el.style.transform='';el.style.zIndex='';
    if(!moved&&pm==='drag')flash(T2('पत्ते को ऊपर मेज़ की ओर खींचिए','Drag the card up to the table'))};
  el.onpointerup=end;el.onpointercancel=end;
}

/* game flow */
function act(p,m){
  clearTimeout(ui.timer);ui.forced=0;
  if(ON.active){onlineSend(m);return}
  const done=G.phase==='play'&&G.trick.length===G.n-1;
  if(p===0&&G.practice){(ui.hist=ui.hist||[]).push(G);feedback(m)}
  if(p===0&&m.t==='play')vib();
  ui.hint=null;
  m.t==='play'?snd.play():snd.bid();
  G=CallBreak.applyMove(G,p,m);
  if(G.phase==='over')recordResult();
  if(done){
    ui.hold=true;ui.show=G.lastTrick;render();setTimeout(snd.win,350);
    const gg=G;setTimeout(()=>{if(G!==gg)return;ui.hold=false;ui.show=null;render();step();if(G.phase==='roundEnd')autoNext()},1400);   // Home dabane par na atke
  }else{render();step()}
}
function step(){
  clearTimeout(ui.timer);
  if(ON.active){onlineStep();return}
  if(!G||ui.hold||ui.modal||!['bid','play'].includes(G.phase)){ui.dur=0;return}
  const p=G.turn,g=G,human=p===0;
  ui.forced=0;
  if(human&&G.phase==='play'){const mv0=CallBreak.getValidMoves(G,0);
    if(mv0.length===1){   // sirf ek hi patta chal sakta hai (aakhri patta bhi): apne aap chal jaye
      ui.forced=1;ui.dur=0;ui.fb=null;ui.hint=G.practice&&PG.set.coach?computeHint():null;render();snd.turn();
      ui.timer=setTimeout(()=>{if(G!==g||ui.hold||ui.modal)return;act(0,mv0[0])},G.practice?2600:900);return}}
  if(human&&G.practice){ui.dur=0;ui.fb=null;ui.hint=PG.set.coach?computeHint():null;render();snd.turn();return}   // practice: koi timer nahi
  ui.t0=Date.now();
  ui.dur=human?HUMAN_MS:(G.phase==='bid'?1000+rand(600):BOT_MIN+rand(BOT_MAX-BOT_MIN));
  render();if(human)snd.turn();
  ui.timer=setTimeout(()=>{
    if(G!==g||ui.hold||ui.modal)return;
    const mv=CallBreak.getValidMoves(G,p);
    act(p,human?Bots.medium(G,p,mv):Bots[G.daily?'medium':PG.set.level](G,p,mv));   // aapka time khatam: auto-play
  },ui.dur);
}

function trText(k){const d=TR[k];if(d)return d[li()];for(const [re,h,e] of PT){const m=k.match(re);if(m)return (li()?e:h)(m)}return k}
function trNode(n){
  if(n.nodeType===3){const o=n.nodeValue,k=o.trim();if(k){const r=trText(k);if(r!==k)n.nodeValue=o.replace(k,()=>r)}return}
  if(n.nodeType!==1)return;
  [n,...n.querySelectorAll('[placeholder]')].forEach(e=>{if(e.hasAttribute('placeholder'))e.setAttribute('placeholder',trText(e.getAttribute('placeholder')))});
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(trNode);
}
new MutationObserver(ms=>ms.forEach(x=>x.addedNodes.forEach(trNode))).observe($,{childList:true,subtree:true});

const onSend=o=>{if(ON.ws&&ON.ws.readyState===1)ON.ws.send(JSON.stringify(o))};
const ERR={noroom:['ये रूम नहीं मिला','Room not found'],started:['इस रूम का खेल शुरू हो चुका है','That game has already started'],full:['रूम भर चुका है','The room is full'],turn:['अभी आपकी बारी नहीं है','It is not your turn'],illegal:['यह चाल सही नहीं है','That move is not allowed']};
function onConnect(then){
  const url=serverUrl();if(!url){flash(T2('पहले सर्वर का पता डालिए','Enter the server address first'));return}
  if(ON.ws&&ON.ws.readyState===1&&ON.ok){if(then)then();return}
  if(ON.ws&&ON.ws.readyState===0){ON.then=then;return}
  let w;try{w=new WebSocket(url)}catch(e){flash(T2('सर्वर का पता सही नहीं है','The server address is not valid'));return}
  ON.ws=w;ON.then=then;clearTimeout(ON.ct);
  ON.ct=setTimeout(()=>{   // server na mile to hamesha na atke
    if(ON.ws!==w||w.readyState===1)return;w._dead=1;try{w.close()}catch(e){}ON.ws=null;ON.ok=false;
    if(ON.active||ON.room)onReconnect();else{if(ON.then){ON.then=null;flash(T2('सर्वर से जुड़ नहीं पाए','Could not connect to the server'))}refreshBox()}},ON.cto);
  w.onopen=()=>w.send(JSON.stringify({t:'hello',name:me().name,e:myEmoji(),token:tokGet()}));
  w.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onMsg(m)};
  w.onclose=()=>{if(w._dead)return;clearTimeout(ON.ct);ON.ok=false;ON.ws=null;
    if(ON.active||ON.room)onReconnect();
    else{if(ON.then){ON.then=null;flash(T2('सर्वर से जुड़ नहीं पाए','Could not connect to the server'))}refreshBox()}};
  w.onerror=()=>{};
}
function onReconnect(){
  if(ON.tries++>8){flash(T2('सर्वर से कनेक्शन टूट गया','Connection to the server was lost'));const was=ON.active;ON.room=null;ON.active=false;if(was)home();return}
  flash(T2('फिर से जुड़ रहे हैं…','Reconnecting…'));setTimeout(()=>{if(ON.room||ON.active)onConnect()},2000);
}
function onMsg(m){
  if(m.t==='hi'){clearTimeout(ON.ct);ON.ok=true;ON.tries=0;
    if((ON.active||ON.room)&&!m.resumed){   // server par ab wo room/game nahi raha
      const was=ON.active;ON.room=null;ON.active=false;ON.q=[];flash(T2('वह गेम ख़त्म हो चुका है','That game is no longer running'));if(was)home();else{BOXFN=onlineHTML;refreshBox()}}
    try{localStorage.setItem('pg_tok',m.token)}catch(e){}const f=ON.then;ON.then=null;if(f)f();refreshBox();return}
  if(m.t==='room'){
    ON.room=m;ON.seat=m.you;ON.seats=m.seats;
    if(m.phase==='lobby'){if(ON.active){ON.keep=1;ON.active=false;home();ON.keep=0}showRoom()}
    else if(ON.active&&G){setBots()}
    return}
  if(m.t==='state'){if(ON.room)onState(m);return}
  if(m.t==='emo'){onEmo(m);return}
  if(m.t==='err'){ON.pending=0;const e=ERR[m.code];flash(e?T2(e[0],e[1]):m.msg);return}
}

  <div class="rseats">${seats}</div>
  <div class="lbl">${r.pub?T2('खिलाड़ी ढूँढ रहे हैं… खाली सीटों पर बॉट बैठेंगे','Looking for players… empty seats will be filled by bots'):T2('कोड दोस्तों को भेजिए। खाली सीटों पर बॉट बैठेंगे।','Send the code to your friends. Empty seats will be filled by bots.')}</div>
  <div class="row">${r.you===r.host?`<button class="gb" onclick="onStart()">▶ ${T2('शुरू करें','Start')} (${hum}/${r.n})</button>`:`<div class="cdn">${T2('होस्ट के शुरू करने का इंतज़ार…','Waiting for the host…')}</div>`}${r.pub?'':'<button class="wb" onclick="shareCode()">📤</button>'}<button class="ghost" onclick="closeM()">${T2('बाहर निकलें','Leave')}</button></div>`;
}
async function shareCode(){
  const r=ON.room;if(!r)return;const base=serverUrl().replace(/^ws/,'http').replace(/\/ws$/,'');
  const txt=T2(`Patte Ghar में मेरे रूम में आइए! रूम कोड: ${r.code}`,`Join my Patte Ghar room! Room code: ${r.code}`)+(base?' — '+base:'');
  try{if(navigator.share)await navigator.share({title:'Patte Ghar',text:txt});else if(navigator.clipboard){await navigator.clipboard.writeText(txt);flash(T2('कोड कॉपी हो गया','Code copied'))}}catch(e){}
}
/* ---- khel: server ka state apne seat ke hisaab se ghumakar dikhana ---- */
function rot(m){
  const g=m.G,n=g.n,s=m.seat,R=a=>a.map((_,i)=>a[(i+s)%n]),L=p=>(p-s+n)%n;
  const o={...g,hands:R(g.hands),bids:R(g.bids),won:R(g.won),totals:R(g.totals),turn:L(g.turn),dealer:L(g.dealer),
    trick:g.trick.map(t=>({p:L(t.p),c:t.c})),history:g.history.map(h=>({bids:R(h.bids),won:R(h.won),score:R(h.score)}))};
  if(g.roundScore)o.roundScore=R(g.roundScore);
  if(g.lastTrick)o.lastTrick={cards:g.lastTrick.cards.map(t=>({p:L(t.p),c:t.c})),w:L(g.lastTrick.w)};
  return o;
}
function setBots(){const n=ON.seats.length,s=ON.seat;BOTS=Array.from({length:Math.max(0,n-1)},(_,i)=>{const x=ON.seats[(i+1+s)%n]||{};return{n:x.name||['?','?'],e:x.e||'🙂'}})}
function enterGame(m){
  const o=document.getElementById('pk');if(o)o.remove();
  ON.active=true;ON.tn=m.tn;ON.q=[];ON.pending=0;ON.dl=m.ms;
  if(ui){clearTimeout(ui.timer);clearInterval(ui.cd)}
  ui={hold:false,show:null,modal:null,deal:true,hist:[],emo:{}};setTimeout(()=>ui.deal=false,200);
  G=rot(m);setBots();snd.deal();render();onlineStep();
}
function onState(m){if(!ON.active){enterGame(m);return}ON.q.push(m);drainQ()}
function drainQ(){while(ON.q.length&&!ui.hold)applyOnline(ON.q.shift())}
const R2=()=>{if(!ui.modal)render()};   // khuli hui window ko render se na todna
function applyOnline(m){
  const prev=G,ng=rot(m);ON.pending=0;ON.dl=m.ms;
  const tcomp=m.tn>ON.tn;ON.tn=m.tn;G=ng;setBots();
  if(prev&&ng.round>prev.round){ui.deal=true;setTimeout(()=>ui.deal=false,200);clearInterval(ui.cd);snd.deal()}
  const lastP=tcomp&&ng.lastTrick?ng.lastTrick.cards[ng.lastTrick.cards.length-1].p:null;
  if((prev&&ng.trick.length>prev.trick.length&&ng.trick[ng.trick.length-1].p!==0)||(lastP!==null&&lastP!==0))snd.play();
  if(ng.phase==='over'&&!ui.rec){ui.rec=1;recordResult()}
  if(tcomp&&ng.lastTrick){
    ui.hold=true;ui.show=ng.lastTrick;R2();snd.win();if(ng.lastTrick.w===0)vib([30,40,30]);
    const gg=G;setTimeout(()=>{if(!ON.active||G!==gg)return;ui.hold=false;ui.show=null;R2();if(G.phase==='roundEnd'&&!ui.modal)autoNext();onlineStep();drainQ()},1400);
  }else{R2();onlineStep()}
}
function onlineStep(){
  clearTimeout(ui.timer);ui.forced=0;
  if(!G||ui.hold||ui.modal||!['bid','play'].includes(G.phase)){ui.dur=0;return}
  const p=G.turn,g=G;ui.t0=Date.now();ui.dur=Math.max(300,ON.dl||0);
  if(p===0&&G.phase==='play'){const mv0=CallBreak.getValidMoves(G,0);
    if(mv0.length===1){ui.forced=1;render();snd.turn();ui.timer=setTimeout(()=>{if(G!==g||ui.hold||ui.modal)return;act(0,mv0[0])},900);return}}
  render();if(p===0){snd.turn();vib(20)}
}
function onlineSend(m){
  if(ON.pending)return;ON.pending=1;setTimeout(()=>ON.pending=0,2500);
  if(m.t==='play'){snd.play();vib(10)}else snd.bid();
  ui.hint=null;onSend({t:'move',m:m.t==='bid'?{t:'bid',n:m.n}:{t:'play',c:{s:m.c.s,r:m.c.r}}});
}
function onlineLeave(){onSend({t:'leave'});ON.active=false;ON.room=null;ON.q=[];ON.pending=0;ON.then=null;if(ui)clearInterval(ui.cd)}
function onlineAgain(){ON.keep=1;ON.active=false;onSend({t:'again'});home();ON.keep=0}
function onEmo(m){
  if(!ON.active||!G)return;const p=(m.seat-ON.seat+G.n)%G.n;ui.emo=ui.emo||{};ui.emo[p]=m.e;R2();
  setTimeout(()=>{if(ui.emo&&ui.emo[p]===m.e){delete ui.emo[p];if(ON.active)R2()}},2600);
}
function emoBox(){
  const o=document.getElementById('emop');if(o){o.remove();return}
  $.insertAdjacentHTML('beforeend',`<div class="emopick" id="emop">${['👍','😂','😮','🔥','👏','😡','🙏'].map(e=>`<button onclick="sendEmo('${e}')">${e}</button>`).join('')}</div>`);
}
function sendEmo(e){onSend({t:'emo',e});const o=document.getElementById('emop');if(o)o.remove()}
PG.cur&&me()?home():login();
</script>
</body>
